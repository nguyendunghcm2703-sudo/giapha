<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thế phả lưu truyền hậu thế</title>
  <meta name="description" content="Gia phả dòng họ (riêng tư, cần mật khẩu)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#7a1418">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <h1 id="title">Thế phả lưu truyền hậu thế</h1>
    <button id="bstat" class="bstat" type="button"></button>
    <button id="bReset" class="bReset" type="button" aria-label="Làm mới" title="Làm mới"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav class="tabs" id="tabs" aria-label="Điều hướng">
    <button data-tab="tree"><span class="ti"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1.2"/><rect x="3" y="16" width="6" height="5" rx="1.2"/><rect x="15" y="16" width="6" height="5" rx="1.2"/><path d="M12 8v4M6 16v-4h12v4"/></svg></span><span>Dòng họ</span></button>
    <button data-tab="gio"><span class="ti ti-emo">🕯️</span><span>Giỗ</span></button>
    <button data-tab="settings"><span class="ti"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5" stroke-width="3.2" stroke-dasharray="2.6 3.1"/><circle cx="12" cy="12" r="6"/></svg></span><span>Cài đặt</span></button>
  </nav>

  <dialog id="dlg"></dialog>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="toast" role="status"></div>

  <script src="lunar.js"></script>
  <script src="app.js"></script>
</body>
</html>
